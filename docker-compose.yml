# Self-hosted FloBase on one machine: the control plane (API + dashboard),
# the API gateway and the platform's own Postgres. Project databases are
# started next to them on the same Docker host.
#
# The install script (scripts/install.sh) writes .env and starts this file.
# To build from source instead of pulling released images, add
# docker-compose.build.yml (see `make up`).

name: flobase

services:
  platform-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flobase
      POSTGRES_PASSWORD: ${FLOBASE_PLATFORM_DB_PASSWORD:?set it in .env}
      POSTGRES_DB: flobase
    volumes:
      - platform-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flobase -d flobase"]
      interval: 2s
      retries: 30

  flobase:
    image: ${FLOBASE_IMAGE:-ghcr.io/flomo-abel-231/flobase}:${FLOBASE_VERSION:-latest}
    # FLOBASE_NAME keeps two FloBases on one Docker engine apart (desktop
    # installs use flobase-local); the control plane finds these by name.
    container_name: ${FLOBASE_NAME:-flobase}-control-plane
    restart: unless-stopped
    depends_on:
      platform-db:
        condition: service_healthy
    environment:
      FLOBASE_MODE: ${FLOBASE_MODE:-self-hosted}
      FLOBASE_API_TOKEN: ${FLOBASE_API_TOKEN:?set it in .env}
      FLOBASE_DATABASE_URL: postgres://flobase:${FLOBASE_PLATFORM_DB_PASSWORD}@platform-db:5432/flobase
      FLOBASE_PUBLIC_HOST: ${FLOBASE_PUBLIC_HOST:-localhost}
      FLOBASE_MARKUP: ${FLOBASE_MARKUP:-1.6}
      FLOBASE_OWNER_EMAIL: ${FLOBASE_OWNER_EMAIL:-}
      FLOBASE_GATEWAY_URL: ${FLOBASE_GATEWAY_URL:-http://localhost:28471}
      FLOBASE_ATTACH: ${FLOBASE_NAME:-flobase}-control-plane,${FLOBASE_NAME:-flobase}-gateway
      # Off-site backup copies; leave the bucket empty to keep backups on this machine only.
      FLOBASE_BACKUP_S3_ENDPOINT: ${FLOBASE_BACKUP_S3_ENDPOINT:-}
      FLOBASE_BACKUP_S3_REGION: ${FLOBASE_BACKUP_S3_REGION:-}
      FLOBASE_BACKUP_S3_BUCKET: ${FLOBASE_BACKUP_S3_BUCKET:-}
      FLOBASE_BACKUP_S3_PREFIX: ${FLOBASE_BACKUP_S3_PREFIX:-}
      FLOBASE_BACKUP_S3_ACCESS_KEY: ${FLOBASE_BACKUP_S3_ACCESS_KEY:-}
      FLOBASE_BACKUP_S3_SECRET_KEY: ${FLOBASE_BACKUP_S3_SECRET_KEY:-}
      FLOBASE_BACKUP_ENCRYPTION_KEY: ${FLOBASE_BACKUP_ENCRYPTION_KEY:-}
      # Updates: the control plane checks GitHub Releases and, when auto-update
      # is on and FloBase was installed by the install script, FloBase Desktop
      # or the flobase CLI, runs upgrade.sh.
      FLOBASE_AUTO_UPDATE: ${FLOBASE_AUTO_UPDATE:-false}
      FLOBASE_UPDATE_REPO: ${FLOBASE_UPDATE_REPO:-flomo-abel-231/flobase}
      FLOBASE_INSTALL_DIR: ${FLOBASE_INSTALL_DIR:-}
      FLOBASE_INSTALL_KIND: ${FLOBASE_INSTALL_KIND:-server}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "${FLOBASE_PORT:-28470}:8080"
    volumes:
      # The provisioner creates project databases through the Docker API.
      # Anyone with this socket controls the host: keep the API token secret.
      - /var/run/docker.sock:/var/run/docker.sock

  # Routes each project's REST, auth and GraphQL APIs and checks API keys.
  # It only reads the platform database and never sits behind the control plane.
  gateway:
    image: ${FLOBASE_IMAGE:-ghcr.io/flomo-abel-231/flobase}:${FLOBASE_VERSION:-latest}
    container_name: ${FLOBASE_NAME:-flobase}-gateway
    restart: unless-stopped
    entrypoint: ["flobase-gateway"]
    depends_on:
      flobase:
        condition: service_started
    environment:
      FLOBASE_DATABASE_URL: postgres://flobase:${FLOBASE_PLATFORM_DB_PASSWORD}@platform-db:5432/flobase
    ports:
      - "${FLOBASE_GATEWAY_PORT:-28471}:8000"

volumes:
  platform-db:
